<title>شناسنامه پوستی شادی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one phone-width app column, passport card on top, bottom tab bar; desktop centres the column. */
  :root{
    --bg:#F5EFEC; --surface:#FFFFFF; --sunk:#EDE3DF; --ink:#2B1820; --muted:#7A6168; --line:#E3D5D0;
    --accent:#A23A55; --accent-soft:#F5DDE3; --on-accent:#FFFFFF;
    --ok:#2F7A5B; --ok-soft:#DCEFE5; --warn:#9A6210; --warn-soft:#F6E7CC;
    --card:#2B1820; --card-ink:#F7EDEF; --card-muted:#C9AEB6;
    --f-display:'Markazi Text','Vazirmatn',Tahoma,serif;
    --f-body:'Vazirmatn',-apple-system,'Segoe UI',Tahoma,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1A1215; --surface:#241A1E; --sunk:#2E2227; --ink:#F3E9EC; --muted:#B79FA6; --line:#3A2C31;
      --accent:#E68AA2; --accent-soft:#4A2632; --on-accent:#2B1820;
      --ok:#7CC7A3; --ok-soft:#1F3A2E; --warn:#E2B064; --warn-soft:#3D3020;
      --card:#F3E4E8; --card-ink:#2B1820; --card-muted:#7A6168; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1A1215; --surface:#241A1E; --sunk:#2E2227; --ink:#F3E9EC; --muted:#B79FA6; --line:#3A2C31;
    --accent:#E68AA2; --accent-soft:#4A2632; --on-accent:#2B1820;
    --ok:#7CC7A3; --ok-soft:#1F3A2E; --warn:#E2B064; --warn-soft:#3D3020;
    --card:#F3E4E8; --card-ink:#2B1820; --card-muted:#7A6168; color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;direction:rtl}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 110px;min-height:100%}

  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);direction:ltr;text-align:right}
  .brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;text-wrap:balance}
  .ghost{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}

  .banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
  .banner button{background:var(--warn);color:var(--surface);border:0;border-radius:99px;padding:5px 14px;font-weight:600;font-size:13px}

  .stack{display:grid;gap:14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .panel h2{font-family:var(--f-display);font-size:23px;font-weight:600;margin:0 0 2px;text-wrap:balance}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
  .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);direction:ltr;text-align:right;display:block}

  /* Passport card */
  .passport{background:var(--card);color:var(--card-ink);border-radius:18px;padding:18px 18px 14px;position:relative;overflow:hidden}
  .passport .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .passport .eyebrow{color:var(--card-muted)}
  .passport .name{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 10px}
  .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
  .field span{display:block;font-size:11.5px;color:var(--card-muted)}
  .field b{font-weight:600;font-size:15px}
  .tones{display:flex;gap:3px;margin-top:14px;direction:ltr}
  .tones i{flex:1;height:8px;border-radius:2px;opacity:.45}
  .tones i.on{opacity:1;outline:2px solid var(--card-ink);outline-offset:1px}
  .mrz{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--card-muted);direction:ltr;text-align:left;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:clip}
  .stamp{width:78px;height:78px;flex:none;border-radius:50%;border:1.5px dashed var(--card-muted);display:grid;place-items:center;text-align:center;line-height:1.1;transform:rotate(-8deg)}
  .stamp b{font-family:var(--f-display);font-size:28px;display:block}
  .stamp span{font-size:10px;color:var(--card-muted)}

  .ages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .agebox{background:var(--sunk);border-radius:12px;padding:12px}
  .agebox span{font-size:12.5px;color:var(--muted)}
  .agebox b{display:block;font-family:var(--f-display);font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
  .delta{font-size:13px;font-weight:600}
  .delta.up{color:var(--warn)} .delta.down{color:var(--ok)}

  .score{display:flex;gap:16px;align-items:center}
  .ring{flex:none;width:104px;height:104px}
  .ring text{font-family:var(--f-display);font-weight:700}
  .bars{display:grid;gap:7px;flex:1;min-width:0}
  .bar{display:grid;grid-template-columns:72px 1fr 30px;gap:8px;align-items:center;font-size:12.5px}
  .bar .t{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
  .bar .t i{display:block;height:100%;border-radius:99px;background:var(--ok)}
  .bar .t i.mid{background:var(--warn)} .bar .t i.low{background:var(--accent)}
  .bar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);text-align:left}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:500}
  .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}

  .tip{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
  .tip:first-of-type{border-top:0}
  .tip .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
  .tip b{display:block}
  .tip p{margin:0;color:var(--muted);font-size:13.5px}

  /* Routine */
  .seg{display:flex;background:var(--sunk);border-radius:99px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;border-radius:99px;padding:7px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding-block:12px;border-top:1px solid var(--line)}
  .steps li:first-child{border-top:0}
  .steps .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:3px}
  .steps b{display:block}
  .steps p{margin:0;color:var(--muted);font-size:13.5px}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
  .day{border-radius:10px;padding:8px 2px;font-size:11.5px;background:var(--sunk)}
  .day b{display:block;font-size:12.5px;margin-bottom:2px}
  .day.ret{background:var(--accent-soft);color:var(--accent)}
  .day.exf{background:var(--warn-soft);color:var(--warn)}
  .day.rec{background:var(--ok-soft);color:var(--ok)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}

  /* Habits */
  .habit{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
  .habit:first-of-type{border-top:0}
  .habit .txt{flex:1;min-width:0}
  .habit .txt b{display:block;font-weight:600}
  .habit .txt span{font-size:12.5px;color:var(--muted)}
  .check{width:30px;height:30px;flex:none;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
  .check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  .counter{display:flex;align-items:center;gap:6px}
  .counter button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
  .counter b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  .dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11.5px;color:var(--muted)}
  .dot{height:34px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .dot.l1{background:var(--warn-soft);color:var(--warn)} .dot.l2{background:var(--ok-soft);color:var(--ok)} .dot.l3{background:var(--ok);color:var(--surface)}
  .dot.today{outline:2px solid var(--accent);outline-offset:1px}

  /* Clinic */
  .notice{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px}
  .notice b{color:var(--accent)}
  details.tx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
  details.tx summary{list-style:none;padding:14px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer}
  details.tx summary::-webkit-details-marker{display:none}
  details.tx summary b{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.25}
  details.tx summary small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);direction:ltr;text-align:right;letter-spacing:.05em}
  details.tx .body{padding:0 16px 16px;display:grid;gap:10px;font-size:14px}
  details.tx .body p{margin:0}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:13.5px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  .qs{margin:0;padding-right:18px;font-size:13.5px}
  .caret{transition:transform .2s;color:var(--muted);flex:none}
  details[open] .caret{transform:rotate(180deg)}
  .primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;width:100%}
  .primary:disabled{opacity:.45;cursor:not-allowed}
  textarea.summary{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:13px/1.7 var(--f-body);padding:10px;resize:vertical}

  /* Tabs */
  .tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
  .tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;border-radius:10px}
  .tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabs svg{width:22px;height:22px}

  /* Quiz sheet */
  .sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
  .sheet .in{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:18px}
  .prog{height:4px;background:var(--sunk);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
  .q h2{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.2;margin:0 0 4px;text-wrap:balance}
  .q .sub{margin-bottom:16px}
  .opts{display:grid;gap:8px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{text-align:right;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px}
  .opt b{display:block;font-weight:600}
  .opt span{font-size:12.5px;color:var(--muted)}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .fitz{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;direction:ltr}
  .fitz button{border:2px solid transparent;border-radius:10px;height:54px;font-family:var(--f-mono);font-size:12px;font-weight:500}
  .fitz button[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--surface);outline-offset:-4px}
  label.f{display:grid;gap:6px;font-weight:600}
  label.f input[type=text],label.f input[type=number]{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-weight:400}
  .range{display:grid;gap:4px}
  .range .h{display:flex;justify-content:space-between;font-weight:600}
  .range .h output{color:var(--accent);font-variant-numeric:tabular-nums}
  .range input{width:100%;accent-color:var(--accent)}
  .range small{color:var(--muted);font-size:12px;display:flex;justify-content:space-between}
  .nav{display:flex;gap:10px}
  .nav .ghost{flex:none;padding:12px 18px;border-radius:12px}
  .err{color:var(--accent);font-size:13px;min-height:1.2em;margin:0}

  .toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13.5px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><small>SHADI METHOD · SKIN PASSPORT</small><h1 id="pageTitle">شناسنامه</h1></div>
    <button class="ghost" id="editBtn" type="button">ویرایش پاسخ‌ها</button>
  </header>
  <div class="banner" id="sampleBanner" hidden>
    <span>این یک پروفایل نمونه است.</span>
    <button type="button" id="startBtn">شناسنامه خودم را بساز</button>
  </div>
  <main id="view" class="stack"></main>
  <p class="foot">این اپ آموزشی است و جای معاینه و تشخیص پزشک را نمی‌گیرد.</p>
</div>

<nav class="tabs" aria-label="بخش‌ها">
  <div class="in">
    <button type="button" data-tab="passport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="10" r="3"/><path d="M8 17h8"/></svg>شناسنامه</button>
    <button type="button" data-tab="routine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3h6v4l2 3v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9l2-3z"/><path d="M7 13h10"/></svg>روتین</button>
    <button type="button" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>عادت‌ها</button>
    <button type="button" data-tab="clinic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v18M3 12h18"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>کلینیک</button>
  </div>
</nav>

<div class="sheet" id="quiz" hidden role="dialog" aria-modal="true" aria-label="پرسش‌نامه شناسنامه پوستی">
  <div class="in">
    <div class="nav" style="justify-content:space-between;align-items:center">
      <span class="eyebrow" id="qCount">STEP 1 / 7</span>
      <button class="ghost" type="button" id="qClose">بستن</button>
    </div>
    <div class="prog"><i id="qProg" style="width:14%"></i></div>
    <div class="q" id="qBody"></div>
    <p class="err" id="qErr"></p>
    <div class="nav">
      <button class="ghost" type="button" id="qBack">قبلی</button>
      <button class="primary" type="button" id="qNext">ادامه</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  const SKIN = {oily:'چرب', dry:'خشک', combo:'مختلط', normal:'نرمال', sensitive:'حساس'};
  const CONCERN = {acne:'جوش و آکنه', pigment:'لک و تیرگی', lines:'خطوط و چین‌وچروک', dull:'کدری پوست', pores:'منافذ باز', redness:'قرمزی', sagging:'افتادگی و کاهش حجم', darkcircles:'سیاهی و گودی زیر چشم'};
  const GOAL = {prevent:'پیشگیری', repair:'ترمیم و جوان‌سازی', glow:'درخشندگی'};
  const SUN = {low:'کم (بیشتر داخل خانه/دفتر)', mid:'متوسط (رفت‌وآمد روزانه)', high:'زیاد (بیرون، رانندگی، ساحل)'};
  const FITZ = ['#F6E1D3','#EBC8AE','#D7A887','#B98162','#8C5A3C','#5A3824'];
  const ROMAN = ['I','II','III','IV','V','VI'];

  const SAMPLE = {name:'نمونه', age:34, skin:'combo', fitz:3, concerns:['lines','pigment','dull'], sleep:6, water:5, stress:4, sugar:3, exercise:2, sun:'mid', spf:false, smoke:false, pregnant:false, goal:'repair', sample:true};
  let profile = store.get('sp.profile', SAMPLE);
  let tab = store.get('sp.tab', 'passport');
  let routineMode = 'am';

  /* ---------- scoring ---------- */
  function scores(p){
    const sleep = p.sleep>=7 && p.sleep<=9 ? 100 : p.sleep===6 ? 72 : p.sleep===10 ? 85 : p.sleep===5 ? 48 : 25;
    const water = Math.min(100, Math.round(p.water/8*100));
    const stress = Math.round((6-p.stress)/5*100);
    const food = Math.round((6-p.sugar)/5*100);
    const move = Math.min(100, Math.round(p.exercise/4*100));
    const sun = p.spf ? (p.sun==='high' ? 85 : 100) : (p.sun==='low' ? 55 : p.sun==='mid' ? 35 : 15);
    let total = Math.round(sleep*.22 + sun*.24 + stress*.16 + water*.12 + food*.13 + move*.13);
    if(p.smoke) total -= 15;
    total = Math.max(5, Math.min(100, total));
    return {total, parts:[['خواب',sleep],['محافظت آفتاب',sun],['استرس',stress],['آب',water],['تغذیه',food],['تحرک',move]]};
  }
  function skinAge(p){
    let a = p.age;
    if(!p.spf) a += p.sun==='high' ? 5 : p.sun==='mid' ? 3 : 1;
    if(p.smoke) a += 4;
    if(p.sleep<=5) a += 2; else if(p.sleep===6) a += 1;
    if(p.stress>=4) a += 1;
    if(p.sugar>=4) a += 1;
    if(p.water<=3) a += 1;
    if(p.exercise>=3) a -= 1;
    if(p.spf && p.sun!=='high') a -= 1;
    return Math.max(16, a);
  }
  function priorities(p){
    const list = [];
    if(!p.spf) list.push({w:10, t:'ضدآفتاب هر روز، حتی داخل خانه', d:'اشعه UVA از پنجره هم رد می‌شود. حدود ۸۰٪ پیری قابل‌مشاهده‌ی پوست به آفتاب برمی‌گردد. SPF 50 به اندازه‌ی دو بند انگشت بزن.'});
    if(p.smoke) list.push({w:9, t:'کم‌کردن سیگار', d:'سیگار جریان خون پوست را کم و کلاژن را تخریب می‌کند. هر قدم کوچک اثر دارد.'});
    if(p.sleep<7) list.push({w:8, t:`خواب را از ${fa(p.sleep)} به ۷ ساعت برسان`, d:'ترمیم پوست بیشتر در خواب عمیق اتفاق می‌افتد. یک ساعت مشخص برای خاموش‌کردن گوشی بگذار.'});
    if(p.stress>=4) list.push({w:7, t:'۱۰ دقیقه آرام‌سازی در روز', d:'کورتیزول بالا هم جوش را بیشتر می‌کند هم سد دفاعی پوست را ضعیف. تنفس آرام یا پیاده‌روی کوتاه کافی است.'});
    if(p.sugar>=4) list.push({w:6, t:'قند و شیرینی را کم کن', d:'قند اضافه با فرایند گلیکاسیون به کلاژن می‌چسبد و آن را خشک و شکننده می‌کند.'});
    if(p.water<6) list.push({w:5, t:`آب را از ${fa(p.water)} به ۸ لیوان برسان`, d:'یک بطری کنار دستت بگذار و در تب «عادت‌ها» لیوان‌ها را بشمار.'});
    if(p.exercise<3) list.push({w:5, t:'هفته‌ای ۳ روز تحرک', d:'۳۰ دقیقه پیاده‌روی تند گردش خون پوست را بالا می‌برد و برای طول‌عمر هم یکی از قوی‌ترین عادت‌هاست.'});
    if(!list.length) list.push({w:1, t:'همین مسیر را ادامه بده', d:'عادت‌هایت در وضعیت خوبی است. حالا روتین شب و ثبت روزانه را جدی بگیر.'});
    return list.sort((a,b)=>b.w-a.w).slice(0,3);
  }

  /* ---------- routine ---------- */
  function routine(p){
    const c = new Set(p.concerns), sens = p.skin==='sensitive' || c.has('redness');
    const oilyish = p.skin==='oily' || p.skin==='combo';
    const allowRet = !p.pregnant && (p.age>=25 || c.has('acne') || c.has('lines'));
    const ret = sens ? 'رتینال یا رتینول ملایم (۰.۱–۰.۲۵٪)' : p.age>=35 ? 'رتینول ۰.۳–۰.۵٪ یا رتینال' : 'رتینول ۰.۲۵–۰.۳٪';
    let exf = null;
    if(sens) exf = 'PHA یا لاکتیک ۵٪ (ملایم‌ترین لایه‌بردار)';
    else if((c.has('acne')||c.has('pores')) && oilyish && !p.pregnant) exf = 'BHA سالیسیلیک ۲٪';
    else if(c.has('dull')||c.has('pigment')||c.has('pores')) exf = 'AHA لاکتیک یا مندلیک ۵–۱۰٪';

    const am = [];
    am.push({t:'پاک‌کننده ملایم', d: oilyish ? 'ژل‌شوینده با pH حدود ۵.۵. صبح‌ها یک‌بار کافی است.' : 'شیر یا کرم‌شوینده‌ی بدون سولفات، یا فقط آب ولرم.'});
    if((c.has('pigment')||c.has('dull')||c.has('lines')) && !sens) am.push({t:'سرم ویتامین C', d:'اسید اسکوربیک ۱۰–۱۵٪ روی پوست خشک. آنتی‌اکسیدان و روشن‌کننده است و اثر ضدآفتاب را تقویت می‌کند.'});
    else if(c.has('pigment')||c.has('dull')) am.push({t:'مشتق ویتامین C', d:'SAP یا THD اسکوربات. کمتر تحریک می‌کند و برای پوست حساس مناسب‌تر است.'});
    if(c.has('acne')||c.has('pores')||c.has('redness')||oilyish) am.push({t:'نیاسینامید ۴–۵٪', d:'چربی و منافذ را کنترل و قرمزی را آرام می‌کند. با بیشتر مواد فعال سازگار است.'});
    if(c.has('darkcircles')) am.push({t:'دورچشم کافئین‌دار', d:'به اندازه‌ی یک دانه برنج با ضربه‌ی انگشت حلقه‌ای.'});
    am.push({t: p.skin==='dry' ? 'مرطوب‌کننده سرامیدی غنی' : 'مرطوب‌کننده سبک', d: p.skin==='dry' ? 'سرامید، کلسترول و اسید چرب برای ترمیم سد پوست.' : 'ژل‌کرم با هیالورونیک اسید یا اسکوالان.'});
    am.push({t:'ضدآفتاب SPF 50، PA++++', d: (p.sun==='high' ? 'هر ۲ ساعت تمدید کن. ' : '') + (p.fitz>=4 ? 'فرمول رنگی با آهن اکسید جلوی لک ناشی از نور مرئی را هم می‌گیرد.' : 'به اندازه‌ی دو بند انگشت برای صورت و گردن.')});

    const pm = [];
    pm.push({t:'پاک‌سازی دومرحله‌ای', d:'اول روغن یا بالم پاک‌کننده برای ضدآفتاب و آرایش، بعد همان شوینده‌ی صبح.'});
    if(allowRet) pm.push({t:'شب‌های رتینوئید: ' + ret, d:'به اندازه‌ی یک نخود روی پوست کاملاً خشک. هفته‌ی اول ۲ شب، بعد طبق جدول. دور چشم و لب نزن.'});
    else if(p.pregnant) pm.push({t:'آزلائیک اسید ۱۰٪', d:'در بارداری و شیردهی جایگزین امن‌تر رتینوئید است و به جوش، لک و قرمزی کمک می‌کند. باز هم با پزشکت هماهنگ کن.'});
    else pm.push({t:'سرم آب‌رسان', d:'هیالورونیک اسید روی پوست کمی مرطوب. در این سن پیشگیری از رتینوئید مهم‌تر است.'});
    if(exf) pm.push({t:'شب‌های لایه‌بردار: ' + exf, d:'هیچ‌وقت در همان شب رتینوئید نزن. اگر سوزش ماند، یک هفته کنار بگذار.'});
    if((c.has('lines')||c.has('sagging')) && p.age>=35) pm.push({t:'سرم پپتید', d:'در شب‌های استراحت، برای پشتیبانی از کلاژن.'});
    pm.push({t:'کرم ترمیم‌کننده', d: sens ? 'سرامید + سنتلا آسیاتیکا. شب‌های استراحت فقط همین.' : 'سرامید یا پانتنول. در شب‌های استراحت فقط پاک‌کننده + همین.'});

    // Persian week starts on Saturday
    const days = ['ش','ی','د','س','چ','پ','ج'];
    let plan;
    if(allowRet) plan = sens ? ['ret','rec','rec','ret', exf?'exf':'rec','rec','rec'] : ['ret','rec','ret','rec','ret', exf?'exf':'rec','rec'];
    else if(p.pregnant) plan = ['ret','rec','ret','rec','ret','rec','rec'];
    else plan = ['rec', exf?'exf':'rec','rec','rec', exf?'exf':'rec','rec','rec'];
    const label = {ret: p.pregnant ? 'آزلائیک' : 'رتینوئید', exf:'لایه‌بردار', rec:'ترمیم'};
    return {am, pm, week: days.map((d,i)=>({d, k:plan[i], l:label[plan[i]]})), retLabel: label.ret, exf};
  }

  /* ---------- clinic ---------- */
  const TX = [
    {id:'peel', name:'پیلینگ شیمیایی سطحی', en:'SUPERFICIAL CHEMICAL PEEL', min:18, c:['pigment','dull','acne','pores'], dark:true,
      what:'لایه‌برداری کنترل‌شده با اسیدهایی مثل گلیکولیک، لاکتیک یا مندلیک برای یکنواخت‌شدن رنگ و بافت پوست.', freq:'۳ تا ۶ جلسه، هر ۲ تا ۴ هفته', down:'۲ تا ۵ روز پوسته‌ریزی خفیف',
      ask:['کدام اسید برای تیپ پوست من مناسب‌تر است؟','از چند روز قبل رتینوئید را قطع کنم؟']},
    {id:'micro', name:'میکرونیدلینگ', en:'MICRONEEDLING', min:20, c:['pores','acne','lines','dull'],
      what:'ایجاد سوراخ‌های بسیار ریز و کنترل‌شده برای تحریک کلاژن. برای جای جوش، منافذ و بافت پوست استفاده می‌شود.', freq:'۳ تا ۴ جلسه، هر ۴ تا ۶ هفته', down:'۱ تا ۳ روز قرمزی',
      ask:['عمق سوزن برای مشکل من چقدر است؟','وقتی جوش فعال دارم انجامش درست است؟']},
    {id:'booster', name:'اسکین بوستر هیالورونیک', en:'SKIN BOOSTER · NON-VOLUMISING HA', min:25, c:['dull','lines'],
      what:'تزریق سطحی هیالورونیک اسید غیرحجم‌دهنده برای آب‌رسانی عمقی و کیفیت پوست. فرم صورت را عوض نمی‌کند.', freq:'۲ تا ۳ جلسه با فاصله یک ماه، بعد هر ۶ ماه', down:'برجستگی‌های ریز تا ۲۴ ساعت',
      ask:['اسم برند و مجوز محصول چیست؟','نتیجه برای من حدوداً چقدر می‌ماند؟']},
    {id:'pdrn', name:'پلی‌نوکلئوتید (PDRN)', en:'POLYNUCLEOTIDES', min:28, c:['lines','darkcircles','dull','redness'],
      what:'تزریق مولکول‌های ترمیم‌کننده برای بهبود کیفیت و ضخامت پوست، به‌خصوص پوست نازک زیر چشم.', freq:'۳ تا ۴ جلسه، هر ۲ تا ۳ هفته', down:'کبودی خفیف احتمالی',
      ask:['برای زیر چشم من مناسب است یا فیلر؟','بین جلسه‌ها چه چیزی را رعایت کنم؟']},
    {id:'tox', name:'نوروتوکسین (بوتاکس) برای خطوط حرکتی', en:'NEUROMODULATOR', min:28, c:['lines'],
      what:'عضلات پیشانی، بین ابرو یا دور چشم را موقتاً شل می‌کند تا خطوط حرکتی عمیق نشوند. روی خطوط ثابت و افتادگی اثر کمی دارد.', freq:'اثر حدود ۳ تا ۴ ماه', down:'بدون دوره نقاهت. تا ۴ ساعت دراز نکش',
      ask:['چند واحد و در کدام نقاط تزریق می‌کنید؟','برند و تاریخ انقضای ویال را می‌توانم ببینم؟']},
    {id:'filler', name:'فیلر هیالورونیک', en:'HA DERMAL FILLER', min:30, c:['sagging','darkcircles'],
      what:'جایگزینی حجم ازدست‌رفته در گونه، شقیقه یا خط فک. گودی زیر چشم فقط در دست پزشک باتجربه.', freq:'اثر ۶ تا ۱۸ ماه بسته به ناحیه', down:'تورم و کبودی ۳ تا ۷ روز',
      ask:['هیالورونیداز (حل‌کننده فیلر) در کلینیک دارید؟','چند سی‌سی و برای کدام ناحیه، و چرا؟']},
    {id:'laser', name:'لیزر یا IPL', en:'LASER · IPL', min:20, c:['redness','pigment'], dark:true,
      what:'نور با طول‌موج مشخص برای رگ‌های ریز، قرمزی و لک‌های سطحی.', freq:'۳ تا ۵ جلسه، هر ۳ تا ۴ هفته', down:'تیره‌شدن موقت لک‌ها برای چند روز',
      ask:['کدام دستگاه و چه طول‌موجی برای تیپ پوست من؟','قبل از جلسه چقدر باید از آفتاب دور بمانم؟']},
    {id:'tight', name:'RF میکرونیدلینگ یا هایفو', en:'RF MICRONEEDLING · HIFU', min:35, c:['sagging','lines','pores'],
      what:'گرم‌کردن لایه‌های عمیق‌تر پوست برای سفت‌شدن تدریجی آن.', freq:'۱ تا ۳ جلسه. نتیجه طی ۳ ماه دیده می‌شود', down:'۱ تا ۳ روز قرمزی',
      ask:['برای افتادگی من کدام بهتر است، RF یا هایفو؟','چه نتیجه‌ای واقع‌بینانه است؟']}
  ];
  function matchTx(p){
    const c = new Set(p.concerns);
    const hits = TX.map(t=>({...t, why:t.c.filter(x=>c.has(x))})).filter(t=>t.why.length);
    return {now: hits.filter(t=>p.age>=t.min).sort((a,b)=>b.why.length-a.why.length), later: hits.filter(t=>p.age<t.min)};
  }

  /* ---------- habits ---------- */
  const HABITS = [
    {k:'spf', t:'ضدآفتاب زدم', s:'SPF 50 صبح'},
    {k:'am', t:'روتین صبح', s:'پاک‌کننده، سرم، مرطوب‌کننده'},
    {k:'pm', t:'روتین شب', s:'طبق جدول هفته'},
    {k:'sleep', t:'۷ ساعت خواب', s:'شب گذشته'},
    {k:'move', t:'۳۰ دقیقه تحرک', s:'پیاده‌روی هم حساب است'},
    {k:'sugar', t:'روز بدون شیرینی', s:'قند اضافه نخوردم'}
  ];
  const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let log = store.get('sp.log', {});
  const todayKey = dkey(new Date());
  const dayLog = k => log[k] || {water:0};
  const doneCount = e => HABITS.filter(h=>e[h.k]).length + (e.water>=8 ? 1 : 0);

  /* ---------- views ---------- */
  function ring(v){
    const C = 2*Math.PI*42, off = C*(1-v/100);
    const col = v>=70 ? 'var(--ok)' : v>=45 ? 'var(--warn)' : 'var(--accent)';
    return `<svg class="ring" viewBox="0 0 104 104" role="img" aria-label="امتیاز طول‌عمر ${fa(v)} از ۱۰۰">
      <circle cx="52" cy="52" r="42" fill="none" stroke="var(--sunk)" stroke-width="9"/>
      <circle cx="52" cy="52" r="42" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 52 52)"/>
      <text x="52" y="58" text-anchor="middle" font-size="30" fill="var(--ink)">${fa(v)}</text>
      <text x="52" y="76" text-anchor="middle" font-size="12" fill="var(--muted)">از ۱۰۰</text></svg>`;
  }
  function vPassport(){
    const p = profile, s = scores(p), sa = skinAge(p), diff = sa - p.age;
    const mrz = `SKN<SHADIMETHOD<<${SKIN_EN[p.skin]}<<FTZ${ROMAN[p.fitz-1]}<<A${p.age}<<SA${sa}<<LS${s.total}`.padEnd(46,'<');
    return `

      <div class="row">
        <div style="min-width:0">

    <section class="panel">

      <div class="ages">
        <div class="agebox"><span>سن شناسنامه‌ای</span><b>${fa(p.age)}</b></div>
        <div class="agebox"><span>سن تخمینی پوست</span><b>${fa(sa)}</b>
          <span class="delta ${diff>0?'up':'down'}">${diff>0 ? fa(diff)+' سال بیشتر' : diff<0 ? fa(-diff)+' سال کمتر' : 'هم‌اندازه'}</span></div>

        ${p.pregnant?'<span class="chip warn">بارداری / شیردهی</span>':''}</div>
    </section>`;
  }
  const SKIN_EN = {oily:'OILY', dry:'DRY', combo:'COMBO', normal:'NORMAL', sensitive:'SENS'};

  function vRoutine(){
    const r = routine(profile), list = routineMode==='am' ? r.am : r.pm;

      <div class="tip"><span class="n">۳</span><div><b>صبور باش</b><p>رتینوئید و ویتامین C حدود ۸ تا ۱۲ هفته طول می‌کشد تا نتیجه بدهند.</p></div></div>
    </section>`;
  }

  function vHabits(){
    const e = dayLog(todayKey), n = doneCount(e), total = HABITS.length + 1;
    const days = [];
    for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
    let wd; try{ wd = new Intl.DateTimeFormat('fa-IR',{weekday:'narrow'}); }catch(err){ wd = null; }
    return `
    <section class="panel">
      <h2>امروز</h2>
      <p class="sub">${fa(n)} از ${fa(total)} عادت انجام شده</p>
      <div class="habit"><div class="txt"><b>آب</b><span>هدف: ۸ لیوان</span></div>
        <div class="counter"><button type="button" data-water="-1" aria-label="یک لیوان کمتر">−</button><b>${fa(e.water)} / ۸</b><button type="button" data-water="1" aria-label="یک لیوان بیشتر">+</button></div></div>
      ${HABITS.map(h=>`<div class="habit"><div class="txt"><b>${h.t}</b><span>${h.s}</span></div>
        <button type="button" class="check" data-h="${h.k}" aria-pressed="${!!e[h.k]}" aria-label="${h.t}">${e[h.k]?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>':''}</button></div>`).join('')}
    </section>
    <section class="panel">
      <h2>هفت روز اخیر</h2>
      <p class="sub">تعداد عادت‌های انجام‌شده در هر روز.</p>
      <div class="dots">${days.map(d=>{ const k=dkey(d), c=doneCount(dayLog(k)); const l = c>=6?'l3':c>=4?'l2':c>=1?'l1':'';
        return `<div><div class="dot ${l} ${k===todayKey?'today':''}">${fa(c)}</div>${wd?wd.format(d):''}</div>`; }).join('')}</div>
    </section>
    <p class="sub" style="text-align:center">ثبت‌ها فقط روی همین مرورگر ذخیره می‌شوند.</p>`;
  }

  function vClinic(){
    const p = profile;
    if(p.pregnant) return `<div class="notice"><b>در دوران بارداری و شیردهی</b> بیشتر تزریق‌ها و لیزرها توصیه نمی‌شوند. فعلاً روی روتین ملایم و ضدآفتاب تمرکز کن و هر اقدامی را با پزشکت هماهنگ کن.</div>${vSummary()}`;
    const m = matchTx(p);
    return `
    <div class="notice"><b>این بخش نسخه‌ی پزشکی نیست.</b> گزینه‌هایی است که بر اساس سن و دغدغه‌هایت ارزش دارد با پزشک دارای مجوز مطرح کنی. تصمیم نهایی بعد از معاینه است.</div>
    ${m.now.length ? m.now.map(t=>`
      <details class="tx">
        <summary><div><small>${t.en}</small><b>${t.name}</b>
          <div class="chips" style="margin-top:6px">${t.why.map(w=>`<span class="chip">${CONCERN[w]}</span>`).join('')}</div></div>
          <svg class="caret" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="body">
          <p>${t.what}</p>
          <dl class="kv"><dt>دفعات</dt><dd>${t.freq}</dd><dt>دوره نقاهت</dt><dd>${t.down}</dd></dl>
          ${t.dark && p.fitz>=4 ? `<p class="chip warn" style="border-radius:10px;padding:8px 10px">برای تیپ پوست ${ROMAN[p.fitz-1]} خطر لک بعد از درمان بیشتر است. حتماً درباره‌ی تنظیمات مناسب پوست تیره بپرس.</p>`:''}
          <div><b>از پزشک بپرس:</b><ul class="qs">${t.ask.map(q=>`<li>${q}</li>`).join('')}</ul></div>
        </div>
      </details>`).join('') : `<section class="panel"><p class="sub" style="margin:0">با دغدغه‌ها و سنی که ثبت کردی، فعلاً روتین خانگی کافی است.</p></section>`}
    ${m.later.length ? `<section class="panel"><h2>فعلاً زود است</h2><p class="sub" style="margin:0">${m.later.map(t=>t.name).join('، ')}. برای سن تو معمولاً اول روتین و عادت‌ها پیشنهاد می‌شود.</p></section>`:''}
    ${vSummary()}`;
  }
  function summaryText(){
    const p = profile, r = routine(p), m = p.pregnant ? {now:[]} : matchTx(p);
    return [
      'شناسنامه پوستی | Shadi Method',
      `نام: ${p.name||'-'} | سن: ${fa(p.age)} | نوع پوست: ${SKIN[p.skin]} | فیتزپاتریک: ${ROMAN[p.fitz-1]}`,
      `دغدغه‌ها: ${p.concerns.map(c=>CONCERN[c]).join('، ')||'-'}`,
      `بارداری یا شیردهی: ${p.pregnant?'بله':'خیر'} | سیگار: ${p.smoke?'بله':'خیر'} | ضدآفتاب روزانه: ${p.spf?'بله':'خیر'}`,
      `روتین شب: ${r.pm.map(s=>s.t).join(' ← ')}`,
      m.now.length ? `گزینه‌هایی که می‌خواهم درباره‌شان بپرسم: ${m.now.map(t=>t.name).join('، ')}` : '',
    ].filter(Boolean).join('\n');
  }
  function vSummary(){
    return `<section class="panel">
      <h2>خلاصه برای وقت مشاوره</h2>
      <p class="sub">این متن را کپی کن و برای پزشک یا کلینیک بفرست.</p>
      <textarea class="summary" id="sumText" readonly aria-label="خلاصه پرونده">${esc(summaryText())}</textarea>
      <button class="primary" type="button" id="copyBtn" style="margin-top:10px">کپی خلاصه</button>
    </section>`;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const TITLES = {passport:'شناسنامه', routine:'روتین من', habits:'عادت‌ها', clinic:'کلینیک'};
  function render(){
    $('#pageTitle').textContent = TITLES[tab];
    $('#sampleBanner').hidden = !profile.sample;
    $('#view').innerHTML = tab==='passport' ? vPassport() : tab==='routine' ? vRoutine() : tab==='habits' ? vHabits() : vClinic();
    document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab ? 'page' : 'false'));
  }
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }

  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; store.set('sp.tab',tab); render(); window.scrollTo(0,0); }));
  $('#view').addEventListener('click', ev=>{
    const m = ev.target.closest('[data-mode]'); if(m){ routineMode=m.dataset.mode; render(); return; }
    const w = ev.target.closest('[data-water]');
    const h = ev.target.closest('[data-h]');
    if(w || h){
      const e = {...dayLog(todayKey)};
      if(w) e.water = Math.max(0, Math.min(12, (e.water||0) + Number(w.dataset.water)));
      if(h) e[h.dataset.h] = !e[h.dataset.h];
      log[todayKey] = e; store.set('sp.log', log); render();
      if(doneCount(e) === HABITS.length+1) toast('همه‌ی عادت‌های امروز انجام شد');
      return;
    }
    if(ev.target.id==='copyBtn'){
      const txt = summaryText();
      const fallback = ()=>{ const ta=$('#sumText'); ta.focus(); ta.select(); toast('متن انتخاب شد. کپی کن'); };
      try{ navigator.clipboard.writeText(txt).then(()=>toast('خلاصه کپی شد'), fallback); }catch(e){ fallback(); }
    }
  });

  /* ---------- quiz ---------- */
  let draft, step = 0;
  const rangeEl = (id,label,min,max,val,unit,lo,hi) => `<div class="range"><div class="h"><label for="${id}">${label}</label><output id="${id}o">${fa(val)} ${unit}</output></div>
    <input type="range" id="${id}" min="${min}" max="${max}" value="${val}" data-unit="${unit}"><small><span>${lo}</span><span>${hi}</span></small></div>`;
  const opt = (key,val,b,s,multi) => { const on = multi ? draft[key].includes(val) : draft[key]===val;
    return `<button type="button" class="opt" data-k="${key}" data-v="${val}" ${multi?'data-multi="1"':''} aria-pressed="${on}"><b>${b}</b>${s?`<span>${s}</span>`:''}</button>`; };
  const STEPS = [
    {t:'بیا شناسنامه‌ی پوستت را بسازیم', s:'۷ سؤال کوتاه، حدود ۲ دقیقه.', r:()=>`
      <div class="stack"><label class="f">اسم (اختیاری)<input type="text" id="qName" value="${esc(draft.sample?'':draft.name)}" placeholder="مثلاً مریم" autocomplete="given-name"></label>
      <label class="f">سن<input type="number" id="qAge" inputmode="numeric" min="16" max="80" value="${draft.age}"></label></div>`,
      ok:()=>{ draft.name = $('#qName').value.trim(); const a = Number($('#qAge').value); if(!(a>=16 && a<=80)) return 'سن را بین ۱۶ تا ۸۰ وارد کن.'; draft.age = Math.round(a); }},
    {t:'پوستت چه نوعی است؟', s:'دو ساعت بعد از شستن صورت، بدون هیچ محصولی، پوستت چه حسی دارد؟', r:()=>`<div class="opts">
      ${opt('skin','oily','چرب','همه‌جا براق، منافذ واضح')}${opt('skin','combo','مختلط','پیشانی و بینی براق، گونه‌ها نرمال یا خشک')}
      ${opt('skin','normal','نرمال','نه کشیده، نه براق')}${opt('skin','dry','خشک','کشیده، گاهی پوسته‌پوسته')}${opt('skin','sensitive','حساس','زود قرمز می‌شود یا می‌سوزد')}</div>`},
    {t:'رنگ پوستت کدام است؟', s:'مقیاس فیتزپاتریک: هرچه تیره‌تر، کمتر می‌سوزد ولی زودتر لک می‌شود.', r:()=>`<div class="fitz">${FITZ.map((c,i)=>`<button type="button" data-fitz="${i+1}" aria-pressed="${draft.fitz===i+1}" style="background:${c};color:${i>=3?'#fff':'#2B1820'}" aria-label="تیپ ${ROMAN[i]}">${ROMAN[i]}</button>`).join('')}</div>
      <p class="sub" style="margin-top:10px">I: همیشه می‌سوزد، برنزه نمی‌شود · VI: هیچ‌وقت نمی‌سوزد</p>`},
    {t:'مهم‌ترین دغدغه‌هایت؟', s:'حداکثر ۳ مورد.', r:()=>`<div class="opts two">${Object.entries(CONCERN).map(([k,v])=>opt('concerns',k,v,'',true)).join('')}</div>`,
      ok:()=>{ if(!draft.concerns.length) return 'دست‌کم یک مورد انتخاب کن.'; }},
    {t:'خواب و آب', s:'میانگین یک هفته‌ی معمولی.', r:()=>`<div class="stack">${rangeEl('qSleep','خواب شبانه',4,10,draft.sleep,'ساعت','۴','۱۰')}${rangeEl('qWater','آب روزانه',0,12,draft.water,'لیوان','۰','۱۲')}</div>`,
      ok:()=>{ draft.sleep=+$('#qSleep').value; draft.water=+$('#qWater').value; }},
    {t:'سبک زندگی', s:'صادق باش، کسی نمی‌بیند.', r:()=>`<div class="stack">${rangeEl('qStress','سطح استرس',1,5,draft.stress,'از ۵','آرام','خیلی زیاد')}
      ${rangeEl('qSugar','قند و شیرینی',1,5,draft.sugar,'از ۵','تقریباً هیچ','هر روز زیاد')}${rangeEl('qEx','ورزش در هفته',0,7,draft.exercise,'روز','۰','۷')}</div>`,
      ok:()=>{ draft.stress=+$('#qStress').value; draft.sugar=+$('#qSugar').value; draft.exercise=+$('#qEx').value; }},
    {t:'آفتاب و چند سؤال آخر', s:'این‌ها روی سن پوست و پیشنهادهای کلینیک اثر دارند.', r:()=>`<div class="stack">
      <div class="opts">${Object.entries(SUN).map(([k,v])=>opt('sun',k,v)).join('')}</div>
      <div class="opts two">${opt('spf',true,'ضدآفتاب هر روز','')}${opt('spf',false,'گاهی یا هرگز','')}</div>
      <div class="opts two">${opt('smoke',false,'سیگار نمی‌کشم','')}${opt('smoke',true,'سیگار می‌کشم','')}</div>
      <div class="opts two">${opt('pregnant',false,'باردار/شیرده نیستم','')}${opt('pregnant',true,'باردار یا شیرده‌ام','')}</div>
      <div class="opts">${Object.entries(GOAL).map(([k,v])=>opt('goal',k,v)).join('')}</div></div>`}
  ];
  function openQuiz(){ draft = JSON.parse(JSON.stringify(profile)); if(draft.sample){ draft.name=''; } step=0; $('#quiz').hidden=false; document.body.style.overflow='hidden'; drawStep(); }
  function closeQuiz(){ $('#quiz').hidden=true; document.body.style.overflow=''; }
  function drawStep(){
    const S = STEPS[step];
    $('#qCount').textContent = `STEP ${step+1} / ${STEPS.length}`;
    $('#qProg').style.width = ((step+1)/STEPS.length*100)+'%';
    $('#qBody').innerHTML = `<h2>${S.t}</h2><p class="sub">${S.s}</p>${S.r()}`;
    $('#qErr').textContent = '';
    $('#qBack').hidden = step===0;
    $('#qNext').textContent = step===STEPS.length-1 ? 'ساخت شناسنامه' : 'ادامه';
    $('#quiz').scrollTop = 0;
  }
  $('#qBody').addEventListener('input', ev=>{ if(ev.target.type==='range'){ $('#'+ev.target.id+'o').textContent = fa(ev.target.value)+' '+ev.target.dataset.unit; } });
  $('#qBody').addEventListener('click', ev=>{
    const f = ev.target.closest('[data-fitz]'); if(f){ draft.fitz=+f.dataset.fitz; drawStep(); return; }
    const o = ev.target.closest('.opt'); if(!o) return;
    const k = o.dataset.k; let v = o.dataset.v; v = v==='true' ? true : v==='false' ? false : v;
    if(o.dataset.multi){ const a = draft[k]; const i = a.indexOf(v); if(i>=0) a.splice(i,1); else if(a.length<3) a.push(v); else { $('#qErr').textContent='حداکثر ۳ مورد. یکی را بردار.'; return; } }
    else draft[k] = v;
    const keepName = $('#qName') ? $('#qName').value : null;
    drawStep(); if(keepName!==null && $('#qName')) $('#qName').value = keepName;
  });
  $('#qNext').addEventListener('click', ()=>{
    const S = STEPS[step]; const e = S.ok && S.ok(); if(e){ $('#qErr').textContent = e; return; }
    if(step < STEPS.length-1){ step++; drawStep(); return; }
    delete draft.sample; profile = draft; store.set('sp.profile', profile); tab='passport'; store.set('sp.tab',tab);
    closeQuiz(); render(); window.scrollTo(0,0); toast('شناسنامه‌ات ساخته شد');
  });
  $('#qBack').addEventListener('click', ()=>{ const S=STEPS[step]; if(S.ok) S.ok(); if(step>0){ step--; drawStep(); } });
  $('#qClose').addEventListener('click', closeQuiz);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#quiz').hidden) closeQuiz(); });
  $('#editBtn').addEventListener('click', openQuiz);
  $('#startBtn').addEventListener('click', openQuiz);

  render();
})();
</script>
