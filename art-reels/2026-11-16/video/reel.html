<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:#f2ede4;position:relative}
.layer{position:absolute;inset:0;overflow:hidden;opacity:0}
.layer .blur{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55)}
.layer img{position:absolute;left:50%;top:50%;transform-origin:center}
.shade{position:absolute;inset:0;pointer-events:none;z-index:50}
.t{position:absolute;z-index:60;opacity:0;text-shadow:0 2px 24px rgba(0,0,0,.5);left:90px;right:90px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.k{font-size:30px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:#e9c99a}
.h{font-family:'Cormorant Garamond',Georgia,serif;font-size:118px;font-weight:600;line-height:1.02}
.h i{font-weight:500}
.s{font-size:46px;font-weight:600;line-height:1.3}
.s2{font-size:40px;line-height:1.35;opacity:.92}
#cr{position:absolute;z-index:60;left:90px;top:1600px;font-size:19px;letter-spacing:.03em;opacity:.7}
#grain{position:absolute;z-index:70;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
</style></head><body>
<div id="stage"></div>
<div class="shade" id="dim" style="background:#000;opacity:0;z-index:45"></div>
<div class="shade" style="background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 30%)"></div>
<div class="shade" style="background:linear-gradient(rgba(0,0,0,0) 45%,rgba(0,0,0,.8))"></div>
<div id="texts"></div>
<div id="cr">Images: The National, Bassam Freiha Art Foundation, Luisa Dorr, Tashkeel</div>
<div id="grain"></div>
<script>
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), oc=x=>1-Math.pow(1-cl(x),3), seg=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const DROP=2.4, BEAT=0.6, END=17.4;
const sn=x=>x;
// [src, start, end, mode, z0, z1, py, dim]
const RAW=[
 ['vantage.jpg',0,0.6,'cover',1.08,1.0,0,.45],
 ['guiragossian.jpg',0.6,1.2,'cover',1.08,1.0,0,.45],
 ['tashkeel.jpg',1.2,1.8,'cover',1.08,1.0,0,.45],
 ['mazrou.jpg',1.8,2.4,'cover',1.08,1.0,0,.45],
 ['arthere.jpg',2.4,4.8,'cover',1.0,1.12,0,.25],
 ['mazrou.jpg',4.8,7.2,'contain',1.0,1.06,-300,0],
 ['guiragossian.jpg',7.2,9.6,'contain',1.0,1.06,-300,0],
 ['vantage.jpg',9.6,12.0,'contain',1.0,1.06,-300,0],
 ['tashkeel.jpg',12.0,14.4,'contain',1.0,1.06,-300,0],
 ['arthere.jpg',14.4,END+1,'cover',1.15,1.05,0,.55],
];
const SH=RAW.map(r=>[r[0],sn(r[1]),r[2]>17?r[2]:sn(r[2]),r[3],r[4],r[5],r[6],r[7]]);
// [html, class, top, start, end]
const TX=[
 ['UAE art news','k',250,0,2.35],
 ['5 UAE art shows<br><i>to see in November</i>','h" style="font-size:112px',1180,0.05,2.35],
 ['01 · Abu Dhabi','k',1110,2.45,4.75],
 ['Art Here 2026<br><i>Confluences</i>','h" style="font-size:108px',1160,2.5,4.75],
 ['Louvre Abu Dhabi · until 28 Feb 2027','s',1410,2.8,4.75],
 ['02 · Abu Dhabi','k',1150,4.85,7.15],
 ['Shaikha Al Mazrou<br><i>Two Horizons</i>','h" style="font-size:100px',1200,4.9,7.15],
 ['Cultural Foundation · until 18 Jul 2027','s',1440,5.2,7.15],
 ['03 · Abu Dhabi','k',1150,7.25,9.55],
 ['Paul Guiragossian<br><i>100 Years of Art</i>','h" style="font-size:100px',1200,7.3,9.55],
 ['Bassam Freiha Art Foundation · until 17 Jan 2027','s" style="font-size:38px',1440,7.6,9.55],
 ['04 · Sharjah','k',1150,9.65,11.95],
 ['Vantage Point 13','h" style="font-size:100px',1200,9.7,11.95],
 ['Sharjah Art Foundation · until 29 Nov','s',1330,10.0,11.95],
 ['05 · Dubai','k',1150,12.05,14.35],
 ['Provisional<br><i>Sanctuaries</i>','h" style="font-size:100px',1200,12.1,14.35],
 ['Tashkeel · until 27 Nov','s',1440,12.4,14.35],
 ['Save this.','h" style="font-size:124px',1120,14.5,99],
 ['Send it to the friend<br>you’d go with.','s" style="font-size:48px',1270,15.0,99],
 ['@art_rada_dxb','s" style="text-align:center;font-weight:400;letter-spacing:.2em;font-size:34px',1490,15.5,99],
];
const stage=document.getElementById('stage'),L=[];
SH.forEach(s=>{const d=document.createElement('div');d.className='layer';d.innerHTML=`<div class="blur" style="background-image:url(img/${s[0]})"></div><img src="img/${s[0]}">`;stage.appendChild(d);L.push(d);});
const TE=TX.map(x=>{const d=document.createElement('div');d.innerHTML=`<div class="t ${x[1]}" style="top:${x[2]}px">${x[0]}</div>`.replace('class="t h" style="font','class="t h" style="font');document.getElementById('texts').appendChild(d.firstChild);return document.getElementById('texts').lastChild;});
// fix: class strings containing style
TE.forEach((e,i)=>{const c=TX[i][1];if(c.includes('style=')){const [cls,st]=c.split('" style="');e.className='t '+cls;e.setAttribute('style',`top:${TX[i][2]}px;`+st);}});
function fit(img,mode){const W=1080,H=1920,r=img.naturalWidth/img.naturalHeight;let w,h;
 if(mode==='cover'){if(r>W/H){h=H;w=H*r}else{w=W;h=W/r}}else{const mw=940,mh=960;if(r>mw/mh){w=mw;h=mw/r}else{h=mh;w=mh*r}}
 img.style.width=w+'px';img.style.height=h+'px';}
window.render=function(t){
 let dim=0;
 SH.forEach((s,i)=>{const [src,a,b,mode,z0,z1,py,dm]=s;const d=L[i],img=d.querySelector('img');
  if(!img._f&&img.naturalWidth){fit(img,mode);img._f=1}
  const on=t>=a&&t<b; const fadeIn=i>0?cl((t-a)/0.18+1):1; // tiny 0.18s dissolve into each cut
  d.style.opacity=on?1:(t>=a-0.18&&t<a?cl((t-(a-0.18))/0.18):0); d.style.zIndex=i;
  const k=seg(t,a,b); const punch=1+0.04*(1-oc(seg(t,a,a+0.3)));
  img.style.transform=`translate(-50%,-50%) translateY(${py}px) scale(${lerp(z0,z1,k)*punch})`;
  d.querySelector('.blur').style.opacity=mode==='contain'?1:0;
  if(on) dim=dm;
 });
 document.getElementById('dim').style.opacity=dim;
 TE.forEach((e,i)=>{const [,,,a,b]=TX[i];const kin=oc(seg(t,a,a+.4));const o=Math.min(kin,1-seg(t,b-.2,b));e.style.opacity=t<a?0:o;e.style.transform=`translateY(${(1-kin)*36}px)`;});
};
</script></body></html>
